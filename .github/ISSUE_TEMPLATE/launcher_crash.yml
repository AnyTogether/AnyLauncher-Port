name: Launcher crash or freeze (Windows/Linux launcher)
description: The AnyPS5 launcher itself closed unexpectedly or stopped responding (not a game).
title: "Launcher crash"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        The launcher fills this form in when you press **Send Report** after it closed unexpectedly or stopped responding the time before.
        It has already taken your home folder, user and computer names, e-mail addresses and AnyTogether tokens out of everything below. Nothing was sent: this page is what you send.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What the launcher noticed, and what you were doing then (moving fast through the games, opening a panel, starting a game…).
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Operating system, processor and memory.
      placeholder: Windows 11 Pro 10.0 (Build 22631) · AMD Ryzen 7 5800X · 32 GB
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Version
      placeholder: Launcher 0.1.12 (Windows)
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Uncaught error
      description: The first error the launcher's code did not catch in that run, with where it happened.
      render: text
  - type: textarea
    id: log
    attributes:
      label: Last seconds
      description: A line a second before it happened - frames drawn, how long they took (build and raster, average/90th percentile/worst in ms) and what was on screen.
      render: text
