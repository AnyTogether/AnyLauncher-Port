name: anyps5_desktop
description: "AnyPS5 launcher for Windows and Linux (private)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  path: ^1.9.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.31.1

flutter:
  uses-material-design: true
  shaders:
    - shaders/background.frag
  assets:
    - assets/fonts/Figtree-OFL.txt
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
